command: adapt
method: engine
backbone: runs/example_contrastive.pt
task: regression
dataset:
  csv: data/delaney-processed.csv
  smiles_col: auto
  targets: auto
adapter:
  hidden_dims: [128, 64]
  dropout: 0.1
training:
  lr: 1.0e-3
  batch_size: 64
  patience: 30
  seed: 42
split:
  test_frac: 0.2
  val_frac: 0.25
  seed: 42
  stratify: true
outputs:
  adapter: runs/engine_sweep_{idx}.pt
sweep:
  grid:
    training.epochs: [10, 50, 100, 200, 400]
  report: runs/engine_epoch_sweep.csv
