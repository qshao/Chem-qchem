command: adapt
method: engine
backbone: runs/example_contrastive.pt
task: regression
dataset:
  csv: data/delaney-processed.csv
  smiles_col: auto
  targets: auto
adapter:
  hidden_dims: [128, 64]
  dropout: 0.1
training:
  epochs: 100
  lr: 1.0e-3
  batch_size: 64
  patience: 30
  seed: 42
split:
  test_frac: 0.2
  val_frac: 0.25
  seed: 42
  stratify: true
outputs:
  adapter: runs/engine_solubility.pt
  report: runs/engine_metrics.json
