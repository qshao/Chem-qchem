command: adapt
method: mlp_head
backbone: runs/example_contrastive.pt
task: regression
dataset:
  csv: data/delaney-processed.csv
  smiles_col: auto
  targets: auto
adapter:
  hidden_dims: [128, 64]
  dropout: 0.1
training:
  epochs: 300
  lr: 1.0e-3
  batch_size: 128
  patience: 40
  seed: 42
split:
  test_frac: 0.2
  val_frac: 0.25
  seed: 42
  stratify: true
outputs:
  adapter: runs/mlp_head_solubility.pt
  report: runs/mlp_head_metrics.json
