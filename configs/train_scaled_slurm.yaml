  hidden_dim: 64
  message_passing_steps: 3
  hidden_dim_3d: 64
  message_passing_steps_3d: 3
  total_steps: 20000
  log_every: 100
  learning_rate: 0.001
  batch_size: 16
  resume: false
  checkpoint_every: 1000

arms:
  quantum_scaffold:
    teacher_weight: 1.0
    conformer_pool_mode: energy
    energy_temperature: 298.15
    use_scaffold_negmask: true

comparisons: []

seeds: [0, 1, 2]
# Scaffold-disjoint holdout used by the validation harness.
holdout:
  k: 10

probes:
  - method: mlp_head
  - method: finetune

# Downstream probe split: validation/test on the property dataset.
adapt:
  dataset: { csv: data/delaney-processed.csv, smiles_col: auto, targets: auto }
  task: regression
  adapter: { hidden_dims: [128, 64], dropout: 0.1 }
  training: { epochs: 300, lr: 1.0e-3, batch_size: 128, patience: 40, seed: 42 }
  split: { test_frac: 0.2, val_frac: 0.25, seed: 42, stratify: true }

outputs:
  dir: runs/train_scaled_slurm
  report: runs/train_scaled_slurm/report
