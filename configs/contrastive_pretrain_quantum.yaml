# configs/contrastive_pretrain_quantum.yaml
command: contrastive-pretrain

dataset:
  dataset_root: zinc-250k
  subset_ids: [44]
  limit_per_shard: 64
  use_results: true

model:
  hidden_dim: 64
  message_passing_steps: 3

training:
  epochs: 100
  learning_rate: 0.005

contrastive:
  batch_size: 16
  supervised_weight: 1.0
  contrastive_weight: 1.0
  teacher_weight: 1.0
  temperature: 0.1
  energy_temperature: 298.15
  hidden_dim_3d: 64
  num_rbf: 16
  cutoff: 5.0
  message_passing_steps_3d: 3
  conformer_pool_mode: energy
  seed: 0

outputs:
  checkpoint: runs/contrastive_quantum.pt
